[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantcairn"
version = "0.12.13"
description = "AI-driven quantitative research platform for US stock selection"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "QuantCairn Contributors"},
]
keywords = [
    "quantitative-trading",
    "stock-selection",
    "range-trading",
    "yfinance",
    "research",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ── Runtime dependencies (core; demo pipeline works with just these) ──────
# Everything not in [core] goes into an optional dependency group below.
dependencies = [
    "pyyaml>=6.0",          # Config file reading (15+ modules)
    "numpy>=1.25",          # Seeded math, random walks, scoring
    "pandas>=2.0",          # OHLCV DataFrame, selection pipeline
]

[project.optional-dependencies]
# Demo mode works with core deps alone — this extra exists for semantic clarity.
demo = []

# Full research pipeline: add market data + technical scoring.
#   pip install quantcairn[research]
research = [
    "yfinance>=0.2.40",         # Yahoo Finance OHLCV + fundamentals
    "requests>=2.31",           # HTTP client (chart API, news, alerts)
    "ta>=0.11.0",               # RSI, MACD, ATR indicators
    "beautifulsoup4>=4.12.2",   # HTML parsing (S&P 500 list, news)
    "lxml>=4.9.3",              # Fast HTML backend for BeautifulSoup
]

# Broker connectivity (paper + sandbox trading).
#   pip install quantcairn[broker]
broker = [
    "quantcairn[research]",
    "longbridge>=4.0",          # LongBridge OpenAPI SDK
]

# Web dashboard.
#   pip install quantcairn[dashboard]
dashboard = [
    "quantcairn[research]",
    "flask>=3.0",               # HTTP server + Jinja2 templates
    "werkzeug>=3.0",            # WSGI server (bundled with flask)
]

# Full development install.
#   pip install quantcairn[dev]
dev = [
    "quantcairn[research,broker,dashboard]",
]

# Minimum for running tests.
#   pip install quantcairn[test]
# NOTE: test pulls in broker + dashboard because some test modules transitively
# import longbridge/flask — these are safety-protected modules we cannot refactor.
test = [
    "pytest>=7.0",
    "quantcairn[dev]",          # Full stack: research + broker + dashboard
]

[project.urls]
Homepage = "https://github.com/quantcairn/quantcairn"
Documentation = "https://github.com/quantcairn/quantcairn#readme"
Repository = "https://github.com/quantcairn/quantcairn"
Issues = "https://github.com/quantcairn/quantcairn/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["quantcairn", "quantcairn.*", "src", "src.*"]

[tool.setuptools.package-data]
src = ["*.yaml", "*.json", "*.csv"]

# ── pytest ───────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-q", "--tb=short"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

# ── mypy / type checking (future) ────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
