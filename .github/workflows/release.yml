name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test and build dependencies
        run: pip install -e ".[test]" build

      - name: Run release smoke gate
        run: python scripts/release_smoke_test.py --mode fast_preliminary --universe-source sample

      - name: Verify clean checkout before build
        run: |
          if [ -n "$(git status --short)" ]; then
            echo "Working tree is dirty before release build:"
            git status --short
            exit 1
          fi

      - name: Build package
        run: python -m build

      - name: Verify package metadata
        run: |
          python -c "
          import glob, zipfile, email.parser
          wheels = sorted(glob.glob('dist/quantcairn-*.whl'))
          assert wheels, 'No wheel found in dist/ (expected dist/quantcairn-*.whl)'
          assert len(wheels) == 1, f'Expected exactly 1 wheel, found {len(wheels)}: {wheels}'
          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as z:
              names = [n for n in z.namelist() if n.endswith('METADATA')]
              assert names, 'No METADATA found in wheel'
              with z.open(names[0]) as f:
                  meta = email.parser.BytesParser().parse(f)
              assert meta['Name'] == 'quantcairn', f\"Name mismatch: {meta['Name']}\"
              assert meta['Version'].startswith('0.'), f\"Version mismatch: {meta['Version']}\"
              print(f'Package: {meta[\"Name\"]} {meta[\"Version\"]}')
              print(f'License: {meta[\"License\"]}')
              print('Metadata OK')
          "

      - name: Install wheel and smoke test
        run: |
          WHEELS=(dist/quantcairn-*.whl)
          if [ ${#WHEELS[@]} -eq 0 ] || [ ! -f "${WHEELS[0]}" ]; then
            echo "ERROR: No wheel found in dist/"
            exit 1
          fi
          if [ ${#WHEELS[@]} -gt 1 ]; then
            echo "ERROR: Expected exactly 1 wheel, found ${#WHEELS[@]}: ${WHEELS[*]}"
            exit 1
          fi
          pip install "${WHEELS[0]}"
          python -c "import quantcairn; print('quantcairn', quantcairn.__version__)"
          python -c "from quantcairn import DemoDataProvider; p=DemoDataProvider(); assert len(p.symbols)==5; print('demo OK')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
