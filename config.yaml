# ============================================================
# SOXS Range Arbitrage — 利益最大化配置
# 目标: $3,000 → $10,000 (区间套利 + 复利)
# ============================================================

ticker: "SOXS"
mode: "paper"

# ---------- 区间设定 ----------
range:
  mode: "auto"              # 自动检测，每5分钟刷新
  support_price: null
  resistance_price: null
  auto_lookback: 30         # 30根5分钟K线
  auto_refresh_minutes: 5   # 5分钟刷新一次
  trend_filter:
    enabled: true           # 下跌趋势不买
    ma_period: 20           # MA20 (更平滑，减少假突破)
    min_trend_strength: 0.3
  tolerance_pct: 0.3        # 0.3% 容差精准触发

# ---------- 仓位管理 ----------
position:
  size_per_trade: 0         # 0=自动计算 (使用80%现金)
  max_position: 9999        # 自动仓位，不设限
  cool_down_seconds: 30     # 冷却30秒
  initial_capital: 3000.0   # $3,000 起始资金

# ---------- 风控规则 ----------
risk:
  stop_loss_pct: 1.5        # 1.5%止损，紧保护
  take_profit_pct: null     # 用阻力位出场
  daily_loss_limit: 180.0   # 日亏损上限 $180 (6%)
  max_consecutive_losses: 3 # 连亏3笔暂停30分钟
  max_drawdown_pct: 8.0     # 回撤>8%暂停

# ---------- 交易时间 ----------
trading_hours:
  timezone: "America/New_York"
  start: "09:30"
  end: "16:00"
  early_close: "13:00"

# ---------- 数据源 ----------
data:
  provider: "yfinance"
  poll_interval_seconds: 10

# ---------- 通知 ----------
notifications:
  console: true
  macos_notification: true
  webhook_url: null
  trade_summary_interval: 3

# ---------- 长桥证券 (实盘时配置) ----------
broker:
  longbridge:
    app_key: ""
    app_secret: ""
    access_token: ""
    region: "cn"
    enabled: false
    environment: "prod"
    http_url: null
    quote_ws_url: null
    trade_ws_url: null
    log_path: null
