# Sample configuration for SOXS Range Arbitrage
# Copy this file to config.yaml or config.local.yaml and customize values.

ticker: "SOXS"
mode: "paper"

range:
  mode: "auto"
  support_price: null
  resistance_price: null
  auto_lookback: 30
  auto_refresh_minutes: 5
  trend_filter:
    enabled: true
    ma_period: 20
    min_trend_strength: 0.3
  tolerance_pct: 0.3
  min_profit_per_trade: 1.0
  quick_stop_pct: 3.0

position:
  size_per_trade: 0
  max_position: 300
  cool_down_seconds: 30
  initial_capital: 3000.0

risk:
  stop_loss_pct: 1.5
  take_profit_pct: null
  daily_loss_limit: 180.0
  max_consecutive_losses: 3
  max_drawdown_pct: 8.0

trading_hours:
  timezone: "America/New_York"
  start: "09:30"
  end: "16:00"
  early_close: "13:00"

data:
  provider: "yfinance"
  poll_interval_seconds: 10

notifications:
  console: true
  macos_notification: true
  webhook_url: null
  trade_summary_interval: 5

broker:
  longbridge:
    app_key: ""
    app_secret: ""
    access_token: ""
    region: "cn"
    enabled: false
    environment: "prod"   # sandbox / prod
    http_url: null
    quote_ws_url: null
    trade_ws_url: null
    log_path: null
